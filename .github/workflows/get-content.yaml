name: Sync Content to v4

on:
  workflow_dispatch:
  push:
    branches:
      - content

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Fetch all branches
      run: git fetch origin

    - name: Switch to v4 branch
      run: git checkout v4

    - name: Copy .md and other files from content branch to content directory
      run: |
        # Remove existing content directory and create fresh one
        rm -rf content
        mkdir -p content
        
        # Copy all .md, .bib, .png, .jpg files from content branch to content directory
        git ls-tree -r --name-only origin/content | grep -E '\.(md|bib|png|jpg)$' | while read file; do
          if git cat-file -e origin/content:"$file" 2>/dev/null; then
            mkdir -p "content/$(dirname "$file")"
            git show origin/content:"$file" > "content/$file"
          fi
        dones
        
        # Add all files in content directory
        git add content/

    - name: Commit changes if any
      run: |
        if ! git diff --cached --quiet; then
          git commit -m "Sync content from content branch ($(date +'%Y-%m-%d %H:%M:%S'))"
        else
          echo "No changes in content directory - skipping commit"
        fi

    - name: Push to v4
      run: git push origin v4
