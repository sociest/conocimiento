name: Sync Content to v4

on:
  push:
    branches:
      - content

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Fetch all branches
      run: git fetch origin

    - name: Switch to v4 branch
      run: git checkout v4

    - name: Copy .md and other files from content branch to content directory
      run: |
        git checkout origin/content -- content || {
          echo "No content directory found in origin/content branch - skipping checkout"
          exit 0
        }
        # Remove existing content directory and replace with new one
        rm -rf content
        mkdir -p content
        git checkout origin/content -- content
        # Optionally, filter for .md and other files if needed
        # find content -type f \( -name "*.md" -o -name "*.txt" -o -name "*.pdf" \) -exec git add {} +
        git add content/

    - name: Commit changes if any
      run: |
        if ! git diff --cached --quiet; then
          git commit -m "Sync content from content branch ($(date +'%Y-%m-%d %H:%M:%S'))"
        else
          echo "No changes in content directory - skipping commit"
        fi

    - name: Push to v4
      run: git push origin v4
